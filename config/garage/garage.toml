metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
# Advertised over the compose network so the init container can reach the node.
rpc_public_addr = "garage:3901"
# rpc_secret is provided via the GARAGE_RPC_SECRET environment variable.

[s3_api]
# us-east-1 is the default region every S3 client falls back to, so clients
# need no explicit region config to produce a matching SigV4 signature.
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
# admin_token is provided via the GARAGE_ADMIN_TOKEN environment variable.
