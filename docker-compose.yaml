services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data &&  \
        mkdir -p /data/loki-ruler && \
        mkdir -p /data/tempo && \
        mkdir -p /data/mimir && \
        minio server /data --console-address ':9001'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.7.1
    container_name: loki
    ports:
      - 3100:3100
      - 7946
      - 9095
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/config.yaml
    command: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
    depends_on:
      minio:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo.yaml
    expose:
      - 3200
      - 4317
      - 4318
    depends_on:
      minio:
        condition: service_healthy
      mimir:
        condition: service_started

  mimir:
    image: grafana/mimir:3.0.5
    container_name: mimir
    command: ["-config.file=/etc/mimir.yaml", "-config.expand-env=true"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./config/mimir/mimir.yaml:/etc/mimir.yaml
    ports:
      - 9008:9008
      - 9009:9009
    depends_on:
      minio:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:main-distroless
    container_name: prometheus
    ports:
      - 9090:9090
    command:
      [
        "--web.enable-remote-write-receiver",
        "--config.file=/etc/prometheus/prometheus.yaml",
      ]
    volumes:
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml

  promtail:
    image: grafana/promtail:3.6
    container_name: promtail
    volumes:
      - /var/log:/var/log
      - ./config/promtail/config.yaml:/etc/promtail/config.yaml
    command: ["-config.file=/etc/promtail/config.yaml"]

  grafana:
    image: grafana/grafana:12.4.2
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE}
      - GF_SECURITY_ALLOW_EMBEDDING=${GF_SECURITY_ALLOW_EMBEDDING}
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started
      prometheus:
        condition: service_started

  otel:
    image: otel/opentelemetry-collector-contrib:nightly
    container_name: otel
    ports:
      - 4317:4317 # gRPC
      - 4318:4318 # HTTP
      - 8888:8888 # prometheus-collector
      - 8889:8889 # prometheus-exporter
      - 1888:1888 # pprof
      - 13133:13133 # Health
      - 55679:55679 # z-pages
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel/otel.yaml:/etc/otelcol/config.yaml
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started
      grafana:
        condition: service_started
      prometheus:
        condition: service_started

volumes:
  minio_data:
