services:
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: garage
    ports:
      - 127.0.0.1:3900:3900 # S3 API
      - 127.0.0.1:3903:3903 # Admin API
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./config/garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage
    command: ["/garage", "server"]
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bootstrap: assigns the cluster layout, imports the S3 key and
  # creates the loki-data/loki-ruler/tempo/mimir buckets, then exits.
  garage-init:
    build:
      context: ./config/garage
      dockerfile: Dockerfile.init
    container_name: garage-init
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
    volumes:
      - ./config/garage/garage.toml:/etc/garage.toml:ro
      # Shared so the CLI can read the node key for local admin control.
      - garage_data:/var/lib/garage
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"

  # Community web UI for Garage (buckets, keys, layout) via the Admin API.
  garage-webui:
    image: khairul169/garage-webui:1.1.0
    container_name: garage-webui
    ports:
      - 127.0.0.1:3909:3909
    environment:
      - API_BASE_URL=http://garage:3903
      - API_ADMIN_KEY=${GARAGE_ADMIN_TOKEN}
      - S3_ENDPOINT_URL=http://garage:3900
      - S3_REGION=us-east-1
    depends_on:
      garage:
        condition: service_healthy
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.1
    container_name: loki
    ports:
      - 3100:3100
      - 7946
      - 9095
    environment:
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/config.yaml
    command: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
    depends_on:
      garage-init:
        condition: service_completed_successfully

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    environment:
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo.yaml
    expose:
      - 3200
      - 4317
      - 4318
    depends_on:
      garage-init:
        condition: service_completed_successfully
      mimir:
        condition: service_started

  mimir:
    image: grafana/mimir:3.0.5
    container_name: mimir
    command: ["-config.file=/etc/mimir.yaml", "-config.expand-env=true"]
    environment:
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
    volumes:
      - ./config/mimir/mimir.yaml:/etc/mimir.yaml
    ports:
      - 9008:9008
      - 9009:9009
    depends_on:
      garage-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:main-distroless
    container_name: prometheus
    ports:
      - 9090:9090
    command:
      [
        "--web.enable-remote-write-receiver",
        "--config.file=/etc/prometheus/prometheus.yaml",
      ]
    volumes:
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml

  promtail:
    image: grafana/promtail:3.6
    container_name: promtail
    volumes:
      - /var/log:/var/log
      - ./config/promtail/config.yaml:/etc/promtail/config.yaml
    command: ["-config.file=/etc/promtail/config.yaml"]

  grafana:
    image: grafana/grafana:12.4.2
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE}
      - GF_SECURITY_ALLOW_EMBEDDING=${GF_SECURITY_ALLOW_EMBEDDING}
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started
      prometheus:
        condition: service_started

  otel:
    image: otel/opentelemetry-collector-contrib:nightly
    container_name: otel
    ports:
      - 4317:4317 # gRPC
      - 4318:4318 # HTTP
      - 8888:8888 # prometheus-collector
      - 8889:8889 # prometheus-exporter
      - 1888:1888 # pprof
      - 13133:13133 # Health
      - 55679:55679 # z-pages
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel/otel.yaml:/etc/otelcol/config.yaml
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started
      grafana:
        condition: service_started
      prometheus:
        condition: service_started

volumes:
  garage_data:
